<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <nav>
        <ul>
            <li><label style="color: white; margin: 0 15px;">📌 Menú</label></li>
            <li><a href="conocenos.html">Conócenos</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="inicio.html" class="logout-btn" style="color: white; background: transparent;">Cerrar Sesión</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="usuario-info" id="usuarioInfo"></div>
        <h1>Contacto</h1>
        
        <form id="contactoForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" placeholder="Tema de tu mensaje" required>
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                <button type="reset" class="btn-limpiar">Limpiar</button>
            </div>
        </form>

        <div class="info-contacto">
            <h3>📞 Información de Contacto</h3>
            <p><strong>Teléfono:</strong> +1 (555) 123-4567</p>
            <p><strong>Email:</strong> info@ejemplo.com</p>
            <p><strong>Dirección:</strong> Calle Principal 123, Ciudad, País</p>
            <p><strong>Horario:</strong> Lunes a Viernes, 9:00 AM - 6:00 PM</p>
        </div>
    </div>

    <script>
        function verificarSesion() {
            if (sessionStorage.getItem('logueado') !== 'true') {
                alert('Debes iniciar sesión primero');
                window.location.href = 'inicio.html';
            } else {
                const usuario = sessionStorage.getItem('usuario');
                document.getElementById('usuarioInfo').textContent = '👤 Usuario: ' + usuario;
            }
        }
        verificarSesion();

        document.getElementById('contactoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Mensaje enviado exitosamente! Nos contactaremos pronto.');
            this.reset();
        });
    </script>
</body>
</html>
